# The app window a real head unit gives (see MeasurementQualifiers in CarUiCases.kt), so screens
# lay out the way the car lays them out rather than on a phone default or the whole panel.
qualifiers=w1440dp-h628dp-mdpi
# Plain Application: the module's real one is @HiltAndroidApp, and none of the DI it stands up is
# reachable from a screen rendered with its state passed in.
application=android.app.Application
