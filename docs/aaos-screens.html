<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nyasa Music — AAOS screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0C;
  --chrome:#111118;
  --glass:#181824;
  --raised:#1E1E2A;
  --gold:#C9A84C;
  --gold-dim:#7a6428;
  --gold-glow:rgba(201,168,76,.25);
  --txt:#fff;
  --txt2:#ACACBC;
  --txt3:#555568;
  --line:rgba(255,255,255,.08);
  --line-soft:rgba(255,255,255,.06);
  --line-active:rgba(201,168,76,.5);
  --blue:#1A3A5C;
  --track:#2A2A38;
  --error:#FFB4AB;
  --font:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
.hit{display:inline-grid;place-items:center;min-width:76px;min-height:76px}
body{background:#050506;font-family:var(--font);color:var(--txt);padding:40px 24px 120px}
/* base size for every icon; context rules below override where they need to */
.ic{width:24px;height:24px;flex:none}

/* ---- page furniture (not part of the designs) ---- */
.page-head{max-width:1200px;margin:0 auto 40px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.page-head h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.page-head p{color:var(--txt2);font-size:15px;margin-top:6px}
.shot{max-width:1200px;margin:0 auto 56px}
.shot-label{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.shot-label b{font-size:15px;font-weight:700;letter-spacing:.02em}
.shot-label span{font-size:13px;color:var(--txt3)}
.frame{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000}
.stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left;background:var(--bg);overflow:hidden}

/* ---- shared chrome ---- */
.sysbar{position:absolute;top:0;left:0;right:0;height:80px;background:var(--chrome);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:5}
.wordmark{color:var(--gold);font-size:20px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.sysbar-right{display:flex;align-items:center;gap:4px}
.sysbar-right .ic{width:24px;height:24px;opacity:.8}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--txt2)}
.clock{font-size:16px;font-weight:500;opacity:.8;white-space:nowrap}

.rail{position:absolute;left:0;top:80px;bottom:88px;width:80px;background:var(--chrome);display:flex;flex-direction:column;align-items:center;padding-top:16px;z-index:4}
.rail-item{width:76px;height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:999px;color:var(--txt2)}
.rail-item .ic{width:28px;height:28px}
.rail-item span{font-size:13px;font-weight:500;letter-spacing:.01em}
.rail-item.on{color:var(--gold);background:rgba(201,168,76,.12);box-shadow:0 0 32px rgba(201,168,76,.22)}
/* with no mini-player the rail runs to the bottom edge */
.stage.nomini .rail{bottom:0}

.mini{position:absolute;left:0;right:0;bottom:0;height:88px;background:var(--glass);border-top:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 28px;z-index:5}
.mini-art{width:64px;height:64px;border-radius:8px;flex:none;background:linear-gradient(135deg,#4b2a8f,#8b5cf6 55%,#c084fc)}
.mini-meta{width:230px;flex:none;min-width:0}
.mini-meta b{display:block;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-meta span{display:block;font-size:15px;color:var(--txt2)}
.mini-bar{flex:1;height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--gold);border-radius:2px}
.mini-ctl{display:flex;align-items:center;gap:2px;flex:none}
.mini-ctl .ic{width:28px;height:28px;color:var(--txt)}
.playbtn{width:76px;height:76px;border-radius:50%;background:var(--gold);display:grid;place-items:center;flex:none;box-shadow:0 0 24px rgba(201,168,76,.3)}
.playbtn .ic{width:30px;height:30px;color:#0A0A0C}

/* ---- content region ---- */
.content{position:absolute;left:80px;right:0;top:80px;bottom:88px;padding:32px 48px;overflow:hidden}
.content.nonav{left:0}
.content.full{bottom:0}

/* ---- atmosphere ---- */
.aurora{position:absolute;inset:0;pointer-events:none}
.aurora::before,.aurora::after{content:"";position:absolute;border-radius:50%;filter:blur(120px)}
.aurora::before{width:900px;height:640px;left:-160px;bottom:-180px;background:rgba(26,58,92,.55)}
.aurora::after{width:820px;height:560px;right:-120px;top:-140px;background:rgba(100,60,180,.30)}

/* ---- type ---- */
.title{font-size:40px;font-weight:700;letter-spacing:-.02em}
.sect{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-bottom:16px}
.sub{font-size:22px;color:var(--txt2)}
.meta{font-size:15px;color:var(--txt2)}
.legal{font-size:14px;color:var(--txt2);letter-spacing:.01em}

/* ---- components ---- */
.badge{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--line-active);color:var(--gold);font-size:17px;font-weight:600}
.badge .ic{width:20px;height:20px}
.btn{height:76px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:16px;font-size:20px;font-weight:600;letter-spacing:.02em}
.btn-ghost{border:1px solid rgba(255,255,255,.12);color:var(--txt)}
.btn-quiet{border:1px solid rgba(255,255,255,.05);color:var(--txt3)}
.btn-gold{background:var(--gold);color:#0A0A0C;box-shadow:0 0 32px rgba(201,168,76,.22)}
.chip{height:76px;padding:0 28px;border-radius:999px;display:inline-flex;align-items:center;font-size:19px;font-weight:500;background:var(--raised);border:1px solid rgba(255,255,255,.12);color:var(--txt)}
.chip.on{background:var(--gold);color:#0A0A0C;font-weight:700;border-color:transparent}
.card{background:var(--glass);border:1px solid var(--line-soft);border-radius:20px}
.input{height:76px;border-radius:16px;background:var(--raised);border:2px solid var(--gold);box-shadow:0 0 28px rgba(201,168,76,.18);display:flex;align-items:center;gap:18px;padding:0 22px}
.input .ic{width:26px;height:26px;color:var(--txt2)}
.input .mic{color:var(--gold)}
.ph{font-size:22px;color:var(--txt3)}

/* cover art */
.art{border-radius:8px;flex:none;background-size:cover}
.g-violet{background:linear-gradient(135deg,#3b1e6e,#7c3aed 55%,#a855f7)}
.g-teal{background:linear-gradient(135deg,#07343a,#0d9488 60%,#2dd4bf)}
.g-blue{background:linear-gradient(135deg,#0b1f3f,#1d4ed8 60%,#60a5fa)}
.g-amber{background:linear-gradient(135deg,#4a2408,#b45309 55%,#f59e0b)}
.g-pink{background:linear-gradient(135deg,#7a1140,#db2777 55%,#fb7185)}
.g-slate{background:linear-gradient(135deg,#111c2e,#334155 60%,#64748b)}
.g-cyan{background:linear-gradient(135deg,#04303a,#0891b2 55%,#22d3ee)}
.g-mauve{background:linear-gradient(135deg,#3d1b33,#9d5c7c 55%,#e0a3b8)}
.g-bronze{background:linear-gradient(135deg,#2e1a06,#92601f 55%,#d9a441)}
.g-green{background:linear-gradient(135deg,#062e21,#059669 60%,#34d399)}

/* ---- added for screens 7–20 ---- */
.row{display:flex;align-items:center;gap:16px}
.hdr-art{border-radius:16px;flex:none;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.toggle{width:64px;height:36px;border-radius:999px;background:var(--track);position:relative;flex:none}
.toggle i{position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#6d6d80;transition:none}
.toggle.on{background:var(--gold)}
.toggle.on i{left:32px;background:#0A0A0C}
.setrow{display:flex;align-items:center;gap:20px;height:96px;padding:0 24px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.scrim{position:absolute;inset:0;background:rgba(4,4,6,.74);backdrop-filter:blur(4px);z-index:6}
.dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;
        background:var(--glass);border:1px solid var(--line);border-radius:24px;
        box-shadow:0 40px 120px rgba(0,0,0,.7)}
.skel{background:linear-gradient(90deg,#14141d 25%,#20202c 37%,#14141d 63%);
      background-size:400% 100%;animation:sh 1.5s ease-in-out infinite;border-radius:12px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.empty-orb{width:180px;height:180px;border-radius:50%;display:grid;place-items:center;
           background:radial-gradient(circle at 50% 40%,#1b1b28,#101018 70%);
           border:1px solid var(--line);box-shadow:0 0 60px rgba(201,168,76,.10)}
.pillbtn{height:76px;padding:0 36px;border-radius:999px;display:inline-flex;align-items:center;
         gap:12px;font-size:20px;font-weight:600;letter-spacing:.02em}
.scrub{height:6px;border-radius:3px;background:var(--track);position:relative}
.scrub i{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:var(--gold)}
.scrub b{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:var(--gold);
         transform:translate(-50%,-50%);box-shadow:0 0 18px rgba(201,168,76,.6)}
.num{width:34px;text-align:right;font-size:18px;color:var(--txt2);flex:none;font-variant-numeric:tabular-nums}
</style>
</head>

  <h1>Nyasa Music — AAOS</h1>
  <p>Twenty screens at 1920 × 1080, rendered from <code>docs/aaos-DESIGN.md</code>. Chrome is injected from one source, so the system bar, rail, and mini-player are provably identical across every screen.</p>

<div id="shots"></div>

<script>
const ICON = (id, cls) =>
  `<svg class="ic ${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round"><use href="#${id}"/></svg>`;

/* One definition of the chrome contract. Every screen gets the same markup. */
const sysbar = () => `
  <div class="sysbar">
    <div class="wordmark">Nyasa Music</div>
    <div class="sysbar-right">
      <span class="hit">${ICON('i-search')}</span>
      <span class="hit">${ICON('i-settings')}</span>
      <span class="hit"><span class="avatar">A</span></span>
      <div class="clock" style="margin:0 12px">10:41 PM</div>
      ${ICON('i-wifi')}${ICON('i-bt')}${ICON('i-battery')}
    </div>
  </div>`;

const RAIL = [['i-home','Home','home'],['i-grid','Browse','browse'],
              ['i-library','Library','library'],['i-heart','Favourites','fav']];
const rail = active => `
  <div class="rail">
    ${RAIL.map(([ic,label,key]) =>
      `<div class="rail-item ${key===active?'on':''}">${ICON(ic)}<span>${label}</span></div>`).join('')}
  </div>`;

const mini = playing => `
  <div class="mini">
    <div class="mini-art"></div>
    <div class="mini-meta"><b>After Midnight</b><span>Nova Grey</span></div>
    <div class="mini-bar"><i style="width:62%"></i></div>
    <div class="mini-ctl">
      <span class="hit">${ICON('i-heart')}</span><span class="hit">${ICON('i-prev')}</span>
      <div class="playbtn">${ICON(playing?'i-pause':'i-play')}</div>
      <span class="hit">${ICON('i-next')}</span><span class="hit">${ICON('i-queue')}</span>
    </div>
  </div>`;

/* ------------------------------------------------------------------ screens */
const screens = [];

/* 1 — CarAuthScreen. Pre-sign-in: system bar only. */
screens.push({
  n:1, name:'CarAuthScreen', note:'system bar only — nobody signed in, nothing playing',
  chrome:{bar:true},
  html:`
  <div class="aurora"></div>
  <div class="content nonav full" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0">
    <div style="font-size:72px;font-weight:700;color:var(--gold);letter-spacing:-.03em;line-height:1">Nyasa Music</div>
    <div style="width:360px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:22px 0 40px"></div>
    <div class="title">Welcome back</div>
    <div class="sub" style="margin-top:10px">Connect your music profile before you drive</div>
    <div class="badge" style="margin-top:26px">${ICON('i-car')}Parked mode only</div>

/* ------------------------------------------------------------------ render */
document.getElementById('shots').innerHTML = screens.map(s => `
  <div class="shot">
    <div class="shot-label"><b>${s.n} — ${s.name}</b><span>${s.note}</span></div>
    <div class="frame"><div class="stage ${'mini' in s.chrome ? '' : 'nomini'}">
      ${s.html}
      ${s.chrome.bar ? sysbar() : ''}
      ${s.chrome.rail ? rail(s.chrome.rail) : ''}
      ${'mini' in s.chrome ? mini(s.chrome.mini) : ''}
    </div></div>
  </div>`).join('');

/* #s=7 isolates a single screen — handy for reviewing one at a time */
const solo = () => {
  const m = location.hash.match(/^#s=(\d+)$/);
  const shots = document.querySelectorAll('.shot');
  document.querySelector('.page-head').style.display = m ? 'none' : '';
  shots.forEach((el, i) => el.style.display = (!m || i === +m[1] - 1) ? '' : 'none');
};

const fit = () => document.querySelectorAll('.frame').forEach(f => {
  f.querySelector('.stage').style.transform = `scale(${f.clientWidth / 1920})`;
});
solo();
fit();
addEventListener('resize', fit);
addEventListener('hashchange', () => { solo(); fit(); });
</script>
